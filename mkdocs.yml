site_name: "Nicolas Bourré"
site_description: "Enseignement, cours et tutoriels en informatique."
site_url: "https://nbourre.github.io/"

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list

nav:
  - Accueil: index.md
  - Mon parcours: parcours.md
  - Mes intérêts: interets.md
  - Cours enseignés:
    - Résumé: cours/index.md
    - Système embarqué: https://nbourre.github.io/0sx_notes_cours/
    - Veille technologique: https://nbourre.github.io/1sh_notes_cours/
  - Ateliers pour secondaire: https://nbourre.github.io/ateliers_secondaires/
  - Articles:
    - Filtre de Kalman:
      - articles/kalman/index.md
      - articles/kalman/01_variables_aleatoires.md
      - articles/kalman/02_distribution_gaussienne.md
      - articles/kalman/03_variance_qualite.md
      - articles/kalman/04_fusion_donnees.md
      - articles/kalman/05_filtre_1d.md
      - articles/kalman/06_matrice_covariance.md
      - articles/kalman/07_espace_etat.md
      - articles/kalman/08_filtre_multivarie.md
  - Tutoriels: tutoriels.md
  - Varia: varia.md

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@NicolasBourre
    - icon: fontawesome/brands/github
      link: https://github.com/nbourre/